[project]
name = "pypocketminer"
version = "0"
dependencies = [
  "numpy",
  "pandas",
  "mdtraj",
  "tqdm",
  "tensorflow"
]

[project.optional-dependencies]
dev = [
  "black",
  "ruff",
  "pytest"
]

[build-system]
requires = [ "setuptools" ]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"pypocketminer.models.pretrained" = ["**/*"]
"pypocketminer.data" = ["**/*"]
